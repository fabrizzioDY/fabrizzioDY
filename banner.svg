    </linearGradient>
    <linearGradient id="terminal-bar" x2="1" y2="1">
      <stop stop-color="#111c36"/><stop offset="1" stop-color="#142142"/>
    </linearGradient>
    <linearGradient id="terminal-border" x2="1" y2="1">
