    </linearGradient>
    <linearGradient id="prompt-color" x2="1" y2="0">
      <stop stop-color="#7dcfff"/><stop offset=".46" stop-color="#a2a7fc"/><stop offset="1" stop-color="#e99acb"/>
    </linearGradient>
    <linearGradient id="name-color" x2="0" y2="1">
