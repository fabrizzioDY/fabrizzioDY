    </linearGradient>
    <linearGradient id="blossom" x1="0" y1="1" x2=".4" y2="0">
      <stop stop-color="#5c3b85"/><stop offset=".54" stop-color="#a364b3"/><stop offset="1" stop-color="#c480c3"/>
    </linearGradient>
    <linearGradient id="loose-petal" x2="1" y2="1">
