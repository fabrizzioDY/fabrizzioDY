<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Fabrizzio</title>
  <desc id="banner-description">Backend Developer · Software Engineering. Cherry blossoms frame a night scene with Mount Fuji, Tokyo Tower and a terminal at ~/dev/fabrizzio.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1">
      <stop stop-color="#171428"/><stop offset=".47" stop-color="#0d1429"/><stop offset="1" stop-color="#101c46"/>
    </linearGradient>
    <radialGradient id="horizon">
      <stop stop-color="#2778d7" stop-opacity=".59"/><stop offset=".53" stop-color="#164c9e" stop-opacity=".35"/><stop offset="1" stop-color="#164c9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop stop-color="#7545c2" stop-opacity=".36"/><stop offset="1" stop-color="#7545c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon-halo">
      <stop stop-color="#7aa2f7" stop-opacity=".24"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon-face" x2=".75" y2="1">
      <stop stop-color="#a2a2fc"/><stop offset="1" stop-color="#737bdb"/>
    </linearGradient>
    <pattern id="grid-lines" width="43" height="43" patternUnits="userSpaceOnUse">
      <path d="M43 0H0V43" fill="none" stroke="#5786e1" stroke-width="1.6"/>
    </pattern>
    <radialGradient id="grid-fade">
      <stop stop-color="white"/><stop offset=".52" stop-color="white" stop-opacity=".65"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-masks" maskUnits="userSpaceOnUse" x="0" y="0" width="1500" height="500">
      <ellipse cx="1213" cy="36" rx="248" ry="112" fill="url(#grid-fade)"/>
      <ellipse cx="110" cy="427" rx="284" ry="151" fill="url(#grid-fade)"/>
    </mask>
    <linearGradient id="bark" x2=".8" y2="1">
